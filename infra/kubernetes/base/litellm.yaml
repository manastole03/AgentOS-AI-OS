apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: healthos-openai
        litellm_params: { model: os.environ/OPENAI_MODEL, api_key: os.environ/OPENAI_API_KEY }
      - model_name: healthos-anthropic
        litellm_params: { model: os.environ/ANTHROPIC_MODEL, api_key: os.environ/ANTHROPIC_API_KEY }
      - model_name: healthos-gemini
        litellm_params: { model: os.environ/GEMINI_MODEL, api_key: os.environ/GEMINI_API_KEY }
      - model_name: healthos-embedding
        litellm_params: { model: openai/text-embedding-3-small, api_key: os.environ/OPENAI_API_KEY }
    router_settings:
      routing_strategy: latency-based-routing
      num_retries: 2
      timeout: 120
      fallbacks:
        - healthos-openai: [healthos-anthropic, healthos-gemini]
        - healthos-anthropic: [healthos-openai, healthos-gemini]
        - healthos-gemini: [healthos-openai, healthos-anthropic]
    litellm_settings:
      cache: true
      cache_params: { type: redis, host: redis, port: 6379 }
      drop_params: true
      redact_user_api_key_info: true
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels: &labels
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: healthos
spec:
  replicas: 2
  selector: { matchLabels: *labels }
  template:
    metadata:
      labels: *labels
      annotations:
        {
          prometheus.io/scrape: "true",
          prometheus.io/port: "4000",
          prometheus.io/path: /metrics,
        }
    spec:
      serviceAccountName: ai
      securityContext:
        { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable@sha256:19a879f9c4ed466f2438aa08b22e2b472053ab57c6325db73c71d0624d2d4953
          args:
            [
              "--config",
              "/app/config.yaml",
              "--port",
              "4000",
              "--num_workers",
              "2",
            ]
          ports: [{ name: http, containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: healthos-config }
            - secretRef: { name: healthos-secrets }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  { name: healthos-secrets, key: LITELLM_DATABASE_URL }
          volumeMounts:
            [
              {
                name: config,
                mountPath: /app/config.yaml,
                subPath: config.yaml,
                readOnly: true,
              },
            ]
          readinessProbe:
            {
              httpGet: { path: /health/readiness, port: http },
              initialDelaySeconds: 10,
            }
          livenessProbe:
            {
              httpGet: { path: /health/liveliness, port: http },
              initialDelaySeconds: 20,
            }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: config, configMap: { name: litellm-config } }]
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    { app.kubernetes.io/name: litellm, app.kubernetes.io/part-of: healthos }
spec:
  selector:
    { app.kubernetes.io/name: litellm, app.kubernetes.io/part-of: healthos }
  ports: [{ name: http, port: 4000, targetPort: http }]
