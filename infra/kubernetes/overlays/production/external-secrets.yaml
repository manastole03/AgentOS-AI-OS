apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: healthos-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: healthos-runtime
  namespace: healthos
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: healthos-aws-secrets }
  target: { name: healthos-runtime, creationPolicy: Owner }
  dataFrom:
    - extract: { key: healthos/production/runtime }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: healthos
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [gateway, web] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ protocol: TCP, port: 8000 }, { protocol: TCP, port: 3000 }]
