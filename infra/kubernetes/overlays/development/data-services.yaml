apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: &postgres-labels
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: healthos
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: *postgres-labels }
  template:
    metadata: { labels: *postgres-labels }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: healthos }
            - { name: POSTGRES_USER, value: healthos }
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: healthos-secrets, key: POSTGRES_PASSWORD },
                }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: healthos
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: &redis-labels
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: healthos
spec:
  replicas: 1
  selector: { matchLabels: *redis-labels }
  template:
    metadata: { labels: *redis-labels }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: healthos
  ports: [{ name: redis, port: 6379 }]
