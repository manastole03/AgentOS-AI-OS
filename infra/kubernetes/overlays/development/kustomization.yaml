apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: healthos
resources:
  - ../../base
  - data-services.yaml
patches:
  - path: replicas.yaml
configMapGenerator:
  - name: healthos-config
    behavior: merge
    literals:
      - ENVIRONMENT=development
      - LOG_FORMAT=console
      - CORS_ORIGINS=["http://localhost:3000"]
      - GOOGLE_REDIRECT_URI=http://localhost:8080/api/v1/auth/google/callback
