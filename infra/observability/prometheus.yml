global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  - job_name: healthos-gateway
    static_configs: [{ targets: ["gateway:8000"] }]
  - job_name: healthos-api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: healthos-ai
    metrics_path: /metrics
    static_configs: [{ targets: ["ai:8000"] }]
  - job_name: litellm
    metrics_path: /metrics
    static_configs: [{ targets: ["litellm:4000"] }]
  - job_name: opentelemetry-collector
    static_configs: [{ targets: ["otel-collector:9464"] }]
