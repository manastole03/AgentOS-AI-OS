[project]
name = "healthos-api"
version = "0.1.0"
description = "HealthOS core API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "authlib>=1.5,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "healthos-platform",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pgvector>=0.4,<1",
  "pypdf>=6.1,<7",
  "pwdlib[argon2]>=0.3,<1",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis[hiredis]>=8.0.1,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
healthos-create-admin = "healthos_api.cli.create_admin:main"
healthos-job-watch-scan = "healthos_api.cli.job_watch_scan:main"
healthos-seed-demo = "healthos_api.cli.seed_demo:main"
healthos-seed-reference = "healthos_api.cli.seed_reference:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthos_api"]
