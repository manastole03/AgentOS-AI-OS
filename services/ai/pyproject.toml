[project]
name = "healthos-ai"
version = "0.1.0"
description = "HealthOS agent runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<50",
  "deepagents>=0.6,<1",
  "fastapi>=0.115,<1",
  "healthos-platform",
  "httpx>=0.28,<1",
  "langchain-mcp-adapters>=0.3,<1",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "mcp>=1.28,<2",
  "openai>=2.20,<3",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.22,<1",
  "pycryptodome>=3.23,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "redis[hiredis]>=8.1.0,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
healthos-ai-worker = "healthos_ai.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthos_ai"]
