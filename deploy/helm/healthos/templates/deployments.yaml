{{- range $name, $workload := .Values.workloads }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "healthos.fullname" $ }}-{{ $name }}
  labels:
    {{- include "healthos.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $workload.replicas }}
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/part-of: healthos }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: {{ default 8000 $workload.port | quote }}, prometheus.io/path: "/metrics" }
    spec:
      serviceAccountName: {{ include "healthos.fullname" $ }}-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
      containers:
        - name: {{ $name }}
          image: {{ if hasPrefix "ghcr.io/" $workload.image }}{{ $workload.image }}:{{ default $.Values.global.imageTag $workload.tag }}{{ else }}{{ $.Values.global.imageRegistry }}/{{ $workload.image }}:{{ default $.Values.global.imageTag $workload.tag }}{{ end }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- with $workload.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- with $workload.args }}
          args: {{ toJson . }}
          {{- end }}
          {{- if $workload.port }}
          ports: [{ name: http, containerPort: {{ $workload.port }} }]
          {{- end }}
          envFrom:
            - configMapRef: { name: {{ include "healthos.fullname" $ }}-config }
            - secretRef: { name: {{ include "healthos.fullname" $ }}-runtime }
          {{- if $workload.livePath }}
          startupProbe: { httpGet: { path: {{ $workload.livePath }}, port: http }, failureThreshold: 30, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: {{ $workload.livePath }}, port: http }, periodSeconds: 20, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: {{ $workload.readyPath }}, port: http }, periodSeconds: 10, timeoutSeconds: 5 }
          {{- end }}
          resources: {{ toYaml $workload.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq $name "litellm" }}
            - { name: litellm-config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        {{- if eq $name "litellm" }}
        - { name: litellm-config, configMap: { name: {{ include "healthos.fullname" $ }}-litellm } }
        {{- end }}
---
{{- end }}
