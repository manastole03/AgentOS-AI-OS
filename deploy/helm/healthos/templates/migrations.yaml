{{- range $service := list "api" "ai" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "healthos.fullname" $ }}-{{ $service }}-migrate-{{ $.Release.Revision }}
  annotations: { argocd.argoproj.io/hook: PreSync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation, helm.sh/hook: pre-install,pre-upgrade, helm.sh/hook-weight: "-5", helm.sh/hook-delete-policy: before-hook-creation }
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ $service }}-migration, app.kubernetes.io/part-of: healthos } }
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "healthos.fullname" $ }}-{{ $service }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ $.Values.global.imageRegistry }}/healthos-{{ $service }}:{{ $.Values.global.imageTag }}
          workingDir: /app/services/{{ $service }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: {{ include "healthos.fullname" $ }}-config }
            - secretRef: { name: {{ include "healthos.fullname" $ }}-runtime }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
---
{{- end }}
