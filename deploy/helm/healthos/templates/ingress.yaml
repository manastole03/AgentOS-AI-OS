{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "healthos.fullname" . }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.global.domain | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: {{ include "healthos.fullname" . }}-gateway, port: { name: http } } } }
          - { path: /ai, pathType: Prefix, backend: { service: { name: {{ include "healthos.fullname" . }}-gateway, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ include "healthos.fullname" . }}-web, port: { name: http } } } }
{{- end }}
