{{- if .Values.serviceMonitor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "healthos.fullname" . }}-grafana-dashboard
  labels: { grafana_dashboard: "1" }
data:
  healthos.json: |
    {"title":"HealthOS SLOs","uid":"healthos-slos","schemaVersion":39,"panels":[
      {"type":"timeseries","title":"Request rate","gridPos":{"h":8,"w":8,"x":0,"y":0},"targets":[{"expr":"sum by (service) (rate(healthos_http_requests_total[5m]))","legendFormat":"{{`{{service}}`}}"}]},
      {"type":"timeseries","title":"p95 latency","gridPos":{"h":8,"w":8,"x":8,"y":0},"targets":[{"expr":"histogram_quantile(0.95, sum by (le, service) (rate(healthos_http_request_duration_seconds_bucket[5m])))","legendFormat":"{{`{{service}}`}}"}]},
      {"type":"timeseries","title":"5xx errors","gridPos":{"h":8,"w":8,"x":16,"y":0},"targets":[{"expr":"sum by (service) (rate(healthos_http_requests_total{status=~\"5..\"}[5m]))","legendFormat":"{{`{{service}}`}}"}]}
    ]}
{{- end }}
