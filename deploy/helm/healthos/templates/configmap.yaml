apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "healthos.fullname" . }}-config
  labels: {{- include "healthos.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.otelEndpoint | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "healthos.fullname" . }}-litellm
data:
  config.yaml: |
    model_list:
      - model_name: healthos-openai
        litellm_params: { model: os.environ/OPENAI_MODEL, api_key: os.environ/OPENAI_API_KEY }
      - model_name: healthos-anthropic
        litellm_params: { model: os.environ/ANTHROPIC_MODEL, api_key: os.environ/ANTHROPIC_API_KEY }
      - model_name: healthos-gemini
        litellm_params: { model: os.environ/GEMINI_MODEL, api_key: os.environ/GEMINI_API_KEY }
      - model_name: healthos-embedding
        litellm_params: { model: openai/text-embedding-3-small, api_key: os.environ/OPENAI_API_KEY }
    litellm_settings:
      cache: true
      cache_params: { type: redis, host: os.environ/REDIS_HOST, port: 6379, password: os.environ/REDIS_PASSWORD, ssl: true }
      redact_user_api_key_info: true
      drop_params: true
    router_settings: { routing_strategy: latency-based-routing, num_retries: 2, timeout: 120 }
    general_settings: { master_key: os.environ/LITELLM_MASTER_KEY }
