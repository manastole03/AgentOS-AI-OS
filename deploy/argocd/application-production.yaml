apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthos-production
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: healthos
  source:
    repoURL: https://github.com/your-org/healthos.git
    targetRevision: main
    path: deploy/helm/healthos
    helm:
      releaseName: healthos
      valueFiles: [values.yaml, values-production.yaml]
  destination: { server: https://kubernetes.default.svc, namespace: healthos }
  syncPolicy:
    automated: { prune: true, selfHeal: true, allowEmpty: false }
    syncOptions:
      [
        CreateNamespace=true,
        PruneLast=true,
        ApplyOutOfSyncOnly=true,
        ServerSideApply=true,
      ]
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
