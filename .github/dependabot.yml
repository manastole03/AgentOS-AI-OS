version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      frontend:
        patterns: ["next", "react*", "@types/react*"]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly }
