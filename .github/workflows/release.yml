name: Release containers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ai, gateway, web]
        include:
          - service: api
            package: healthos-api
            module: healthos_api.main:app
          - service: ai
            package: healthos-ai
            module: healthos_ai.main:app
          - service: gateway
            package: healthos-gateway
            module: healthos_gateway.main:app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/healthos-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Publish web
        id: build-web
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
      - name: Publish Python service
        id: build-python
        if: matrix.service != 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/python.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            SERVICE_PACKAGE=${{ matrix.package }}
            SERVICE_PATH=${{ matrix.service }}
            APP_MODULE=${{ matrix.module }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign published images with GitHub OIDC
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.build-web.outputs.digest || steps.build-python.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && cosign sign --yes "$tag@$DIGEST"
          done <<< "$TAGS"
