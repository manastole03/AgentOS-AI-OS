name: Promote production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  promote:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}"
      - uses: azure/setup-kubectl@v5
      - name: Promote immutable version through Argo CD Application
        run: |
          kubectl -n argocd patch application healthos-production --type merge -p '{"spec":{"source":{"helm":{"parameters":[{"name":"global.imageTag","value":"${{ inputs.version }}"}]}}}}'
      - name: Wait for reconciled healthy state
        run: |
          kubectl -n argocd wait application/healthos-production --for=jsonpath='{.status.sync.status}'=Synced --timeout=10m
          kubectl -n argocd wait application/healthos-production --for=jsonpath='{.status.health.status}'=Healthy --timeout=15m
