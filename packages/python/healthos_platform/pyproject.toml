[project]
name = "healthos-platform"
version = "0.1.0"
description = "Shared runtime primitives for HealthOS services"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "python-json-logger>=3.3,<4",
  "redis[hiredis]>=8.1.0,<9",
  "starlette>=1.3.1,<2",
  "structlog>=25.4,<26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
